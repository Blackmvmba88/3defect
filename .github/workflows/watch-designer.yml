name: Watch Designer MVP
on:
  pull_request:
    paths:
      - 'defect3d/**'
      - 'tests/test_watch_designer.py'
      - '.github/workflows/watch-designer.yml'
  push:
    branches: ['feat/blackmamba-watch-designer']
jobs:
  watch-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install numpy pytest
      - run: python -m pytest tests/test_watch_designer.py -q
